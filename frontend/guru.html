<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guru & Staff - Website Sekolah</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>🏫 Website Sekolah</h1>
      <nav class="site-nav">
        <a href="index.html">Beranda</a>
        <a href="berita.html">Berita</a>
        <a href="guru.html">Guru &amp; Staff</a>
        <a href="galeri.html">Galeri</a>
        <a href="ppdb.html">PPDB</a>
        <a href="kontak.html">Kontak</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>Guru &amp; Staff</h2>
    <div id="guru-container" class="grid">
      <p class="muted">Memuat data guru...</p>
    </div>
  </main>

  <footer class="site-footer">
    Latihan AWS Lambda — Website Sekolah Serverless
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    async function loadGuru() {
      const container = document.getElementById("guru-container");
      try {
        const items = await apiGet("/guru");
        if (items.length === 0) {
          container.innerHTML = '<p class="muted">Belum ada data guru.</p>';
          return;
        }
        container.innerHTML = items
          .map(
            (g) => `
          <div class="card">
            <h3>${escapeHtml(g.nama)}</h3>
            <p class="muted">${escapeHtml(g.jabatan)}</p>
            ${g.mata_pelajaran ? `<p>Mata pelajaran: ${escapeHtml(g.mata_pelajaran)}</p>` : ""}
          </div>
        `
          )
          .join("");
      } catch (err) {
        container.innerHTML = `<p class="muted">Gagal memuat data guru: ${escapeHtml(err.message)}</p>`;
      }
    }
    loadGuru();
  </script>
</body>
</html>
