<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beranda - Website Sekolah</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>🏫 Website Sekolah</h1>
      <nav class="site-nav">
        <a href="index.html">Beranda</a>
        <a href="berita.html">Berita</a>
        <a href="guru.html">Guru &amp; Staff</a>
        <a href="galeri.html">Galeri</a>
        <a href="ppdb.html">PPDB</a>
        <a href="kontak.html">Kontak</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="profil-container" class="card">
      <p class="muted">Memuat profil sekolah...</p>
    </div>
  </main>

  <footer class="site-footer">
    Latihan AWS Lambda — Website Sekolah Serverless
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    async function loadProfil() {
      const container = document.getElementById("profil-container");
      try {
        const sekolah = await apiGet("/sekolah");
        container.innerHTML = `
          <h2>${escapeHtml(sekolah.nama)}</h2>
          <p class="muted">${escapeHtml(sekolah.alamat)} &middot; ${escapeHtml(sekolah.telepon)} &middot; ${escapeHtml(sekolah.email)}</p>
          <h3>Visi</h3>
          <p>${escapeHtml(sekolah.visi)}</p>
          <h3>Misi</h3>
          <p>${escapeHtml(sekolah.misi)}</p>
          <h3>Sejarah Singkat</h3>
          <p>${escapeHtml(sekolah.sejarah)}</p>
        `;
      } catch (err) {
        container.innerHTML = `<p class="muted">Gagal memuat profil sekolah: ${escapeHtml(err.message)}. Pastikan API_BASE_URL di assets/js/config.js sudah diisi dengan benar dan backend sudah dideploy.</p>`;
      }
    }
    loadProfil();
  </script>
</body>
</html>
