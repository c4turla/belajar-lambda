<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak - Website Sekolah</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>🏫 Website Sekolah</h1>
      <nav class="site-nav">
        <a href="index.html">Beranda</a>
        <a href="berita.html">Berita</a>
        <a href="guru.html">Guru &amp; Staff</a>
        <a href="galeri.html">Galeri</a>
        <a href="ppdb.html">PPDB</a>
        <a href="kontak.html">Kontak</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>Hubungi Kami</h2>
    <div class="card">
      <form id="kontak-form">
        <label for="nama">Nama *</label>
        <input type="text" id="nama" name="nama" required />

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required />

        <label for="subjek">Subjek *</label>
        <input type="text" id="subjek" name="subjek" required />

        <label for="pesan">Pesan *</label>
        <textarea id="pesan" name="pesan" required></textarea>

        <button type="submit">Kirim Pesan</button>
        <div id="form-alert" class="alert"></div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    Latihan AWS Lambda — Website Sekolah Serverless
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const form = document.getElementById("kontak-form");
    const alertEl = document.getElementById("form-alert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await apiPost("/kontak", payload);
        showAlert(alertEl, res.message, "success");
        form.reset();
      } catch (err) {
        showAlert(alertEl, err.message, "error");
      }
    });
  </script>
</body>
</html>
